name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.12'
          terraform_wrapper: false

      # 1. Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 2. Dependency / security checks (scoped to production dependencies)
      - name: Audit production dependencies
        run: yarn audit --groups dependencies
        continue-on-error: true

      # 3. Formatting / lint
      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      # 4. Typecheck
      - name: Typecheck
        run: npx tsc --noEmit

      # 5. Unit tests
      - name: Unit tests with coverage
        run: yarn test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      # 9. Build
      - name: Build
        run: yarn build

      # Infrastructure-as-code checks. No AWS credentials are configured in
      # this workflow, so this validates the Terraform config and the Lambda
      # packaging step without ever calling `plan`/`apply` against a real
      # account.
      - name: Build Lambda deployment packages
        run: yarn build:lambda

      - name: Terraform format check
        run: terraform -chdir=infra fmt -check -diff

      - name: Terraform init
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: Terraform lint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive

      # Static security/misconfiguration analysis for the Terraform config.
      # No AWS credentials needed - this only inspects the .tf files.
      - name: Terraform static analysis (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          quiet: true

      # 10. Docker build
      - name: Docker build
        run: docker build -t certificate-app:ci .

      # Local AWS services for integration/API/E2E tests, run the same way a
      # contributor would run them locally (docker-compose.yml).
      - name: Start LocalStack (Docker Compose)
        run: docker compose up -d localstack dynamodb-admin

      - name: Wait for LocalStack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "LocalStack is up"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time" >&2
          docker compose logs localstack
          exit 1

      # 6/11. Integration tests (real DynamoDB + S3 + Chromium PDF generation
      # against the Dockerized LocalStack)
      - name: Integration tests
        run: yarn test:integration

      # 7/8/11. API/collection tests (Postman/Newman) over real HTTP, against
      # the same Dockerized LocalStack
      - name: API/collection tests
        run: yarn test:api
        env:
          IS_OFFLINE: 'true'
          AWS_REGION: us-east-1
          DYNAMODB_ENDPOINT: http://localhost:4566
          S3_ENDPOINT: http://localhost:4566
          S3_BUCKET_NAME: certificadoignite2021
          API_KEY: test-api-key

      # Full containerized app smoke test: build the app image, start it
      # alongside LocalStack, and exercise both endpoints over real HTTP.
      - name: Docker Compose app smoke test
        run: |
          docker compose up -d --build app
          for i in $(seq 1 30); do
            # verifyCertificate/health-check always 404s (no such id) - any
            # HTTP response at all means the server is accepting connections.
            if curl -s -o /dev/null http://localhost:3000/verifyCertificate/health-check; then
              echo "App is up"
              break
            fi
            sleep 2
          done
          curl -sf -X POST http://localhost:3000/generateCertificate \
            -H "Content-Type: application/json" \
            -H "x-api-key: local-dev-api-key" \
            -d '{"id":"ci-smoke-test","name":"CI Smoke Test","grade":"A+"}'

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v

  # Disabled by default (no-op unless the repo variable below is set) - this
  # project ships with local Terraform state and no AWS OIDC role configured,
  # so a plan/apply here has nothing meaningful to diff against and nowhere
  # to authenticate. See README "Deployment" for the one-time setup (remote
  # backend + OIDC role + `vars.TF_PLAN_ENABLED=true`) that activates it.
  terraform-plan:
    name: Terraform plan (PR)
    if: github.event_name == 'pull_request' && vars.TF_PLAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: yarn build:lambda

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.12'
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform plan
        id: plan
        run: terraform -chdir=infra plan -no-color -input=false | tee /tmp/plan.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Apply is restricted to main via the environment's branch protection rule
  # (configure a "production" GitHub Environment scoped to the main branch,
  # with required reviewers if manual approval before apply is wanted).
  terraform-apply:
    name: Terraform apply (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_PLAN_ENABLED == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: yarn build:lambda

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.12'
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve -input=false
